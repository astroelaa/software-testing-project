$kind: http-request
url: "{{baseUrl}}/sessions/{{sessionId}}/hint"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('hint is returned', function () {
          pm.expect(pm.response.json().hint).to.be.a('string');
      });
    language: text/javascript
order: 2000
