$kind: http-request
url: "{{baseUrl}}/progress"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('progress has expected fields', function () {
          pm.expect(pm.response.json()).to.have.all.keys('overallScore', 'level');
      });
    language: text/javascript
order: 4000
