$kind: http-request
url: "{{baseUrl}}/sessions/missing/answer"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"solved":true}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404', function () {
          pm.response.to.have.status(404);
      });
      pm.test('error is returned', function () {
          pm.expect(pm.response.json().error).to.be.a('string');
      });
    language: text/javascript
order: 8000
